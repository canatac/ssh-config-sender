name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --all

  build-push:
    name: Build & Push relay image
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          REGISTRY_USER: op://Scaleway/registry/user
          REGISTRY_PASS: op://Scaleway/registry/password
      - name: Log in to registry
        run: echo "$REGISTRY_PASS" | docker login rg.fr-par.scw.cloud -u "$REGISTRY_USER" --password-stdin
      - name: Build & push
        run: |
          docker build -f crates/relay/Dockerfile -t rg.fr-par.scw.cloud/${{ vars.SCW_NAMESPACE }}/ssh-migrator-relay:latest .
          docker push rg.fr-par.scw.cloud/${{ vars.SCW_NAMESPACE }}/ssh-migrator-relay:latest

  deploy:
    name: Deploy to Scaleway
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SCW_ACCESS_KEY: op://Scaleway/ssh-migrator-bot/access_key
          SCW_SECRET_KEY: op://Scaleway/ssh-migrator-bot/secret_key
          CONTAINER_ID: op://Scaleway/ssh-migrator-relay/container_id
      - name: Install scw CLI
        run: |
          curl -fsSL https://github.com/scaleway/scaleway-cli/releases/download/v2.30.0/scaleway-cli_2.30.0_linux_amd64 -o /usr/local/bin/scw
          chmod +x /usr/local/bin/scw
      - name: Configure scw
        run: |
          scw config set access-key=$SCW_ACCESS_KEY
          scw config set secret-key=$SCW_SECRET_KEY
          scw config set default-region=fr-par
      - name: Deploy
        run: |
          scw container container update $CONTAINER_ID registry-image=rg.fr-par.scw.cloud/${{ vars.SCW_NAMESPACE }}/ssh-migrator-relay:latest
          scw container container deploy $CONTAINER_ID
